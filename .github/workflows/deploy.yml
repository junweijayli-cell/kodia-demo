name: Publish KORDIA demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: kodia-demo-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Import the tested Garden review once
        if: ${{ hashFiles('assets/images/demo/garden.webp') == '' }}
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = 'junweijayli-cell/kodia-demo'
          python3 - <<'PY'
          import base64,hashlib,io,zipfile
          from pathlib import Path
          payload = base64.b64decode("")
          assert hashlib.sha256(payload).hexdigest() == "baa3e645d012348fc986d8bc198cb416bc5d9826663ef6e11186ac4aadb18533"
          expected = ['BRIEF.md', 'README.md', 'assets/app.js', 'assets/garden-review.css', 'assets/garden-review.js', 'assets/images/demo/garden.webp', 'docs/GARDEN-REVIEW.md', 'docs/garden-home.html', 'index.html', 'scripts/verify-garden.cjs']
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              assert sorted(archive.namelist()) == sorted(expected)
              for name in expected:
                  target = Path(name)
                  assert not target.is_absolute() and '..' not in target.parts
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(name))
          PY
          node --check assets/app.js
          node --check assets/garden-review.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- BRIEF.md README.md assets/app.js assets/garden-review.css assets/garden-review.js assets/images/demo/garden.webp docs/GARDEN-REVIEW.md docs/garden-home.html index.html scripts/verify-garden.cjs
          git commit -m 'Publish reviewed Garden source and poolside setting'
          git push origin HEAD:main
      - name: Validate reviewed static source
        run: |
          test "$GITHUB_REPOSITORY" = 'junweijayli-cell/kodia-demo'
          test ! -e CNAME
          test -f index.html
          test -f assets/images/demo/garden.webp
          test -f assets/images/projects/proj-resort-pool-1600.webp
          node --check assets/app.js
          node --check assets/garden-review.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
