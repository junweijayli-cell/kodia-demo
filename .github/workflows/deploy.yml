name: Publish KORDIA demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: kodia-demo-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate reviewed static source
        run: |
          test "$GITHUB_REPOSITORY" = 'junweijayli-cell/kodia-demo'
          test ! -e CNAME
          test -f index.html
          test -f assets/images/demo/garden.webp
          test -f assets/images/projects/proj-resort-pool-1600.webp
          node --check assets/app.js
          node --check assets/garden-review.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
